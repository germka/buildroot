# This is the most basic ntp configuration file
# The driftfile must remain in a place specific to this
# machine - it records the machine specific clock error
# driftfile /var/lib/ntp/drift
driftfile /var/tmp/drift
logfile /var/log/ntp.log
# This should be a server that is close (in IP terms)
# to the machine.  Add other servers as required.
# Unless you un-comment the line below ntpd will sync
# only against the local system clock.
#
# server time.server.example.com
#
# Using local hardware clock as fallback
# Disable this when using ntpd -q -g -x as ntpdate or it will sync to itself
# https://www.eecis.udel.edu/~mills/ntp/html/refclock.html

#=========================================================
#  Local RTC
#=========================================================
# https://www.eecis.udel.edu/~mills/ntp/html/drivers/driver1.html
#server 127.127.1.0
#fudge 127.127.1.0 stratum 10

#=========================================================
#  GPSD native ntpd driver
#=========================================================
# This driver exists from at least ntp version 4.2.8
# https://www.eecis.udel.edu/~mills/ntp/html/drivers/driver46.html
server 127.127.46.0
fudge 127.127.46.0 flag1 1 time1 0.015 refid GPSD stratum 1

#=========================================================
#  GPS Serial data reference
#=========================================================
#server 127.127.28.0 minpoll 4 maxpoll 4
#fudge 127.127.28.0 flag1 1 time1 0.0 refid GPS

#=========================================================
#  PPS Clock Discipline
#=========================================================
# https://www.eecis.udel.edu/~mills/ntp/html/drivers/driver22.html
server 127.127.22.2 prefer
fudge 127.127.22.2 flag2 0 flag3 1

# Defining a default security setting
restrict 127.0.0.1
restrict localhost
restrict ::1
#restrict default

restrict default kod nomodify notrap nopeer noquery