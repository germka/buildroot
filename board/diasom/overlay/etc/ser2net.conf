%YAML 1.1
---
#
# This is a ser2net configuration file, showing examples of all
# sorts of things.  It's all commented out so it's safe to put
# in /etc/ser2net/ser2net.yaml.
#
# This is described in ser2net.yaml(5)

# YAML gives an error on empty files, just add something so the
# error doesn't happen.
#
# ---
# ser2net 4.3.4 config sample:
# https://github.com/cminyard/ser2net/blob/8c09e2027dfe6df48fa89588ddedaeca6b546602/ser2net.yaml

define: &confver 1.0
define: &log1 "/var/log/taipit/ser2net-slot1.log"
define: &log2 "/var/log/taipit/ser2net-pipe"
define: &log6 "/var/log/taipit/ser2net-slot6.log"

connection: &slot1
  accepter: tcp,11874
  connector: serialdev,/dev/ttyS5,115200n81,local
  options:
    max-connections: 4
    chardelay-scale: 70
    chardelay-min: 5000
    #trace-both: *log1
    #trace-both: *log2
    trace-hexdump: true
    trace-timestamp: true

connection: &slot2
  accepter: tcp,11875
  connector: serialdev,/dev/ttyS3,115200n81,local
  options:
    max-connections: 4

connection: &slot3
  accepter: tcp,11876
  connector: serialdev,/dev/ttyS9,115200n81,local
  options:
    max-connections: 4

connection: &slot4
  accepter: tcp,11877
  connector: serialdev,/dev/ttyS4,115200n81,local
  options:
    max-connections: 4

connection: &slot5-rs485-1
  accepter: tcp,11878
  connector: serialdev,/dev/ttyS7,9600n81,local
  options:
    max-connections: 4

connection: &slot6-rs485-2
  accepter: tcp,11879
  connector: serialdev,/dev/ttyS8,9600n81,local
  options:
    max-connections: 4
    #trace-both: *log6
    trace-hexdump: true
    trace-timestamp: true

connection: &gps-data
  accepter: tcp,11890
  connector: serialdev,/dev/ttyUSB1,115200n81,local
  options:
    max-connections: 4

connection: &gps-at
  accepter: tcp,11891
  connector: serialdev,/dev/ttyUSB3,115200n81,local
  options:
    max-connections: 4